[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "notebook-press"
version = "0.1.2"
description = "A Windows, macOS and Linux desktop exporter for Jupyter notebooks and books"
authors = [{name = "dc73"}]
requires-python = ">=3.11"
dependencies = [
  "nbconvert[webpdf]>=7.16,<8",
  "pypandoc-binary>=1.13,<2",
  "PyYAML>=6,<7",
  "psutil>=6,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pypdf>=5,<7", "pyinstaller>=6,<7", "Pillow>=11,<13"]
book-v1 = ["jupyter-book>=1.0,<2"]
book-v2 = ["mystmd>=1.3,<2"]

[project.scripts]
notebook-press = "notebook_press.__main__:main"

[project.urls]
Repository = "https://github.com/dc73/notebook-press"
Issues = "https://github.com/dc73/notebook-press/issues"

[tool.setuptools.packages.find]
include = ["notebook_press*"]

[tool.setuptools.package-data]
notebook_press = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
