name: Test and build desktop apps
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[dev,book-v1,book-v2]'
      - run: python -m playwright install --with-deps chromium
      - name: Test (Windows and macOS)
        if: runner.os != 'Linux'
        run: python -m pytest -q
      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q
      - name: Build single executable (Windows)
        if: runner.os == 'Windows'
        run: python scripts/build.py --with-browser --onefile
      - name: Build native application (macOS and Linux)
        if: runner.os != 'Windows'
        run: python scripts/build.py --with-browser
      - name: Smoke-test packaged notebook PDF and LaTeX
        env:
          DEBUG: pw:browser
        run: python scripts/smoke_packaged.py
      - name: Archive macOS application
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent 'dist/Notebook Press.app' dist/NotebookPress-macOS.zip
      - name: Archive Linux application
        if: runner.os == 'Linux'
        run: tar -czf dist/NotebookPress-Linux.tar.gz -C dist NotebookPress
      - uses: actions/upload-artifact@v4
        with:
          name: NotebookPress-${{ runner.os }}
          path: |
            dist/NotebookPress.exe
            dist/NotebookPress-*.zip
            dist/NotebookPress-*.tar.gz
          if-no-files-found: error
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: desktop
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create release checksums
        run: |
          cd release
          sha256sum NotebookPress* > SHA256SUMS.txt
      - name: Publish native downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "Notebook Press $RELEASE_TAG" --notes-file docs/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
